<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottie 300x600 Ad</title>

    <style>
        html,

        body {
            margin: 0;
            padding: 0;
            height: 100%;

        }

        /* 🎯 Ad container */
        .banner {
            margin: 0;
            padding: 0;
        }
    </style>

    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <script>
        var clickTag = "https://www.google.com";
    </script>

</head>

<body>

    <div class="banner" onclick="window.open(clickTag,'_blank')">
        <!-- Top Animation -->
        <lottie-player src="./top/top.json" background="transparent" speed="1" loop autoplay style="width: 100%; max-width: 720px; height: 250px;"></lottie-player>
        <!-- Bottom Animation -->
        <lottie-player src="./bottom/bottom.json" background="transparent" speed="1" loop autoplay style="width: 100%; max-width: 720px; height: 250px;"></lottie-player>
    </div>

    </div>

</body>

</html>
